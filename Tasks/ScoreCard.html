
<!DOCTYPE html>
<html>
<head>
    <title>Score Card</title>
    <link rel="stylesheet" href="ScoreCard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="main">

        <div class="box">

            <!-- Result Section -->
            <div class="result">

                <h3>Your Result</h3>

                <div class="circle">
                    <h1>80</h1>
                    <p>of 100</p>
                </div>

                <h2>Great</h2>

                <p class="description">
                    You scored higher than 70% of<br>
                    the people who have taken<br>
                    these tests.
                </p>

            </div>

            <!-- Summary Section -->
            <div class="summary">

                <h3>Summary</h3>

                <div class="item reaction">
                    <i class="fa-solid fa-bolt"></i>
                    <p>Reaction</p>
                    <span><b>90</b> / 100</span>
                </div>

                <div class="item memory">
                    <i class="fa-solid fa-brain"></i>
                    <p>Memory</p>
                    <span><b>85</b> / 100</span>
                </div>

                <div class="item verbal">
                    <i class="fa-regular fa-comment-dots"></i>
                    <p>Verbal</p>
                    <span><b>61</b> / 100</span>
                </div>

                <div class="item visual">
                    <i class="fa-regular fa-eye"></i>
                    <p>Visual</p>
                    <span><b>70</b> / 100</span>
                </div>

                <button>Continue</button>

            </div>

        </div>

    </div>

</body>
</html>
