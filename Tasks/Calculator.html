<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./Calculator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section>
        <div id="main">
            <div class="box b1"></div>
            <div class="box b2">
                <h2>-</h2>
            </div>
            <div class="box b3">
                <h2>*</h2>
            </div>
            <div class="box b4">
                <h2>/</h2>
            </div>
            <div class="box b5">
                <h2>+</h2>
            </div>
            <div class="box b6"><h2>9</h2></div>
            <div class="box b7"><h2>8</h2></div>
            <div class="box b8"><h2>7</h2></div>
            <div class="box b9"><h2>AC</h2></div>
            <div class="box b10"><h2>6</h2></div>
            <div class="box b11"><h2>5</h2></div>
            <div class="box b12"><h2>4</h2></div>
            <div class="box b13">
                <i class="fa-solid fa-rectangle-xmark"></i>
            </div>
            <div class="box b14"><h2>3</h2></div>
            <div class="box b15"><h2>2</h2></div>
            <div class="box b16"><h2>1</h2></div>
            <div class="box b17"><h2>=</h2></div>
            <div class="box b18"><h2>.</h2></div>
            <div class="box b19"><h2>0</h2></div>
            <div class="box b20"><h2>X<sup>2</sup></h2></div>

        </div>
    </section>
    
</body>
</html>
